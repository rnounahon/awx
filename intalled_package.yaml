---
- name: Audit packages Firefox Thunderbird Brotli NodeJS
  hosts: all
  gather_facts: true

  vars:
    packages_to_check:
      - firefox
      - thunderbird
      - brotli
      - nodejs

  tasks:

    - name: Collect package facts
      package_facts:
        manager: auto

    - name: Vérifier les packages
      set_fact:
        audit_result: "{{ audit_result | default({}) | combine({
          item: {
            'installed': (item in ansible_facts.packages),
            'version': (
              ansible_facts.packages[item][0].version
              if item in ansible_facts.packages
              else 'N/A'
            )
          }
        }) }}"
      loop: "{{ packages_to_check }}"

    - name: Créer dossier rapports
      delegate_to: localhost
      run_once: true
      file:
        path: ./reports
        state: directory

    - name: Générer rapport CSV
      delegate_to: localhost
      lineinfile:
        path: ./reports/packages_audit.csv
        create: yes
        line: >-
          {{ inventory_hostname }};
          {{ ansible_default_ipv4.address | default('N/A') }};
          {{ audit_result.firefox.installed }};
          {{ audit_result.firefox.version }};
          {{ audit_result.thunderbird.installed }};
          {{ audit_result.thunderbird.version }};
          {{ audit_result.brotli.installed }};
          {{ audit_result.brotli.version }};
          {{ audit_result.nodejs.installed }};
          {{ audit_result.nodejs.version }}